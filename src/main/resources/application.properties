spring.application.name=patitas-del-santa
server.port=8080

# ===== Base de datos H2 (en memoria) =====
spring.datasource.url=jdbc:h2:mem:patitasdb
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# ===== Consola H2 -> http://localhost:8080/h2-console =====
# JDBC URL en la consola: jdbc:h2:mem:patitasdb  | User: sa | Password: (vacío)
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# ===== JPA / Hibernate =====
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

# ===== JSON =====
spring.jackson.serialization.write-dates-as-timestamps=false

# ===== Errores: incluir el mensaje de la excepción en la respuesta JSON =====
server.error.include-message=always
server.error.include-binding-errors=always
